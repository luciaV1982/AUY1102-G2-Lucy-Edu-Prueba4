name: CI/CD Prueba 3 Ciclo de Vida del Software

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/auy1102-prueba3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas con pytest
        run: pytest -q

      - name: Construir imagen Docker
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Ejecutar contenedor para validar
        run: |
          docker run --rm $IMAGE_NAME:${{ github.sha }}

      - name: Login en Docker Hub
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: Analizar código con SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      - name: Snyk Security Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high
        # Test de SonarCloud - segunda ejecución (comentario ok)

      - name: Docker Scout - Vulnerability Analysis
        if: github.event_name == 'push'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          only-fixed: true
